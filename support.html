<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support - Market</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-slate-100 min-h-screen font-sans">

  <nav class="border-b border-slate-800 p-4 bg-gray-900/80 backdrop-blur-md">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <a href="/" class="text-2xl font-bold text-white">MARKET<span class="text-blue-500">.</span></a>
      <div class="space-x-4">
        <a href="/" class="text-sm text-slate-400 hover:text-white transition">&larr; Home</a>
      </div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-12 space-y-12">
    <section>
      <h2 class="text-2xl font-bold mb-6">Frequently Asked Questions</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-gray-900 p-6 rounded-xl border border-slate-800">
          <h3 class="font-bold text-white mb-2">How do I purchase a template?</h3>
          <p class="text-sm text-slate-400">Click Buy Now on any product listing to complete checkout.</p>
        </div>
        <div class="bg-gray-900 p-6 rounded-xl border border-slate-800">
          <h3 class="font-bold text-white mb-2">Can I test templates before buying?</h3>
          <p class="text-sm text-slate-400">Use Live Preview to open responsive preview viewports.</p>
        </div>
      </div>
    </section>

    <section class="bg-gray-900 p-8 rounded-xl border border-slate-800 max-w-2xl mx-auto space-y-6">
      <h2 class="text-2xl font-bold">Submit Support Request</h2>
      <form id="support-form" class="space-y-4">
        <input type="text" required placeholder="Subject" class="w-full bg-gray-950 border border-slate-800 rounded-lg p-3 text-white">
        <textarea rows="4" required placeholder="Describe issue..." class="w-full bg-gray-950 border border-slate-800 rounded-lg p-3 text-white"></textarea>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium p-3 rounded-lg">Send Ticket</button>
      </form>
      <p id="support-success" class="text-green-400 text-sm text-center hidden p-2 bg-green-500/10 border border-green-500/20 rounded-lg">Ticket submitted!</p>
    </section>
  </main>

  <script>
    document.getElementById('support-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('support-success').classList.remove('hidden');
      e.target.reset();
    });
  </script>
</body>
</html>
