<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXE — Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#F2EEE3;
      --paper-dim:#EAE4D4;
      --ink:#231F18;
      --burgundy:#6E2530;
      --gold:#9C824F;
      --line:#D8CFB8;
    }
    body{ background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; }
    .font-display{ font-family:'Fraunces', serif; font-optical-sizing:auto; }
    .font-mono{ font-family:'IBM Plex Mono', monospace; }
    .hairline{ border-color:var(--line); }
    .fade-in{ animation:fadeIn .35s ease both; }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
    ::selection{ background:var(--burgundy); color:var(--paper); }
  </style>
</head>
<body class="min-h-screen pb-20">

  <header class="border-b hairline sticky top-0 z-20" style="background:rgba(242,238,227,0.92); backdrop-filter:blur(6px);">
    <div class="max-w-6xl mx-auto px-6 md:px-10 py-5 flex justify-between items-center">
      <a href="#" class="font-display text-2xl tracking-tight" style="color:var(--ink)">LUXE<span style="color:var(--burgundy)">·</span></a>
      <span class="hidden md:block font-mono text-[10px] tracking-widest uppercase" style="color:var(--gold)">Catalog No. SS26</span>
      <button onclick="toggleCart()" class="relative border hairline text-xs px-4 py-2 rounded-none font-mono uppercase tracking-wide flex items-center space-x-2 hover:bg-[var(--ink)] hover:text-[var(--paper)] transition-colors">
        <span>Order Slip</span>
        <span id="cart-badge" class="font-mono text-[10px] font-semibold">(0)</span>
      </button>
    </div>
  </header>

  <section class="max-w-6xl mx-auto px-6 md:px-10 pt-14 pb-10 grid grid-cols-1 md:grid-cols-12 gap-6 items-end border-b hairline">
    <div class="md:col-span-8 space-y-3">
      <p class="font-mono text-[11px] uppercase tracking-[0.2em]" style="color:var(--burgundy)">Index — 001</p>
      <h1 class="font-display text-4xl md:text-6xl leading-[1.05]" style="color:var(--ink)">Objects for<br/>daily wear.</h1>
    </div>
    <div class="md:col-span-4">
      <p class="text-sm leading-relaxed" style="color:#4B463B">Three pieces, considered slowly. Minimal hardware, honest materials, made to outlast the season they were cut for.</p>
    </div>
  </section>

  <section class="max-w-6xl mx-auto px-6 md:px-10 py-6 flex items-center space-x-8 border-b hairline font-mono text-xs uppercase tracking-wide">
    <button id="cat-all" onclick="filterCategory('all')" class="pb-1 border-b-2" style="border-color:var(--ink); color:var(--ink)">All Pieces</button>
    <button id="cat-audio" onclick="filterCategory('audio')" class="pb-1 border-b-2 border-transparent" style="color:#8A8371">Audio</button>
    <button id="cat-wearables" onclick="filterCategory('wearables')" class="pb-1 border-b-2 border-transparent" style="color:#8A8371">Wearables</button>
  </section>

  <main class="max-w-6xl mx-auto px-6 md:px-10 py-10 grid grid-cols-1 md:grid-cols-3 gap-px" style="background:var(--line)" id="product-grid">
  </main>

  <div id="cart-drawer" class="fixed inset-y-0 right-0 w-[22rem] shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col" style="background:var(--paper); border-left:1px solid var(--line);">
    <div class="flex justify-between items-baseline border-b hairline px-6 py-5">
      <h3 class="font-display text-xl">Order Slip</h3>
      <button onclick="toggleCart()" class="font-mono text-xs hover:opacity-60">CLOSE ✕</button>
    </div>

    <div id="cart-items" class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
      <p id="empty-msg" class="text-xs font-mono text-center py-10" style="color:#9A9484">— nothing selected yet —</p>
    </div>

    <div class="border-t hairline px-6 py-5 space-y-3" style="border-style:dashed;">
      <div class="flex justify-between font-mono text-sm">
        <span>Subtotal</span>
        <span id="cart-total">$0</span>
      </div>
      <button onclick="checkout()" class="w-full text-xs font-mono uppercase tracking-wide py-3 transition-colors" style="background:var(--ink); color:var(--paper);" onmouseover="this.style.background='var(--burgundy)'" onmouseout="this.style.background='var(--ink)'">
        Confirm Order →
      </button>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 right-6 border hairline text-xs font-mono px-4 py-3 hidden z-50" style="background:var(--ink); color:var(--paper);"></div>

  <script>
    const products = [
      { id: 1, title: "Acoustic Pro Headphones", category: "audio", price: 199, sku: "AUD-01", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" },
      { id: 2, title: "Minimalist Smartwatch", category: "wearables", price: 249, sku: "WBL-02", image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
      { id: 3, title: "Wireless Studio Earbuds", category: "audio", price: 129, sku: "AUD-03", image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500" }
    ];

    let cart = [];

    function renderProducts(items) {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = items.map((p, i) => `
        <div class="p-6 space-y-4 fade-in" style="background:var(--paper)">
          <div class="flex justify-between items-baseline font-mono text-[10px] uppercase tracking-widest" style="color:var(--gold)">
            <span>${p.sku}</span>
            <span>0${i + 1}</span>
          </div>
          <img src="${p.image}" class="w-full h-52 object-cover grayscale-[15%]" style="filter:sepia(4%)">
          <div class="space-y-1">
            <h3 class="font-display text-lg leading-snug" style="color:var(--ink)">${p.title}</h3>
            <p class="font-mono text-sm" style="color:var(--burgundy)">$${p.price}.00</p>
          </div>
          <button onclick="addToCart(${p.id})" class="w-full border hairline text-xs font-mono uppercase tracking-wide py-2.5 transition-colors hover:bg-[var(--ink)] hover:text-[var(--paper)]">
            Add to Order
          </button>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      ['all', 'audio', 'wearables'].forEach(c => {
        const btn = document.getElementById(`cat-${c}`);
        if (c === cat) {
          btn.className = "pb-1 border-b-2";
          btn.style.borderColor = 'var(--ink)';
          btn.style.color = 'var(--ink)';
        } else {
          btn.className = "pb-1 border-b-2 border-transparent";
          btn.style.color = '#8A8371';
        }
      });
      renderProducts(cat === 'all' ? products : products.filter(p => p.category === cat));
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      updateCartUI();
      showToast(`${product.title} added to order slip`);
    }

    function updateCartUI() {
      document.getElementById('cart-badge').textContent = `(${cart.length})`;
      const container = document.getElementById('cart-items');

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-xs font-mono text-center py-10" style="color:#9A9484">— nothing selected yet —</p>`;
        document.getElementById('cart-total').textContent = `$0`;
        return;
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').textContent = `$${total}.00`;

      container.innerHTML = cart.map((item, index) => `
        <div class="flex justify-between items-center pb-3 border-b" style="border-style:dashed; border-color:var(--line);">
          <div>
            <p class="text-sm font-display">${item.title}</p>
            <p class="font-mono text-xs" style="color:var(--burgundy)">$${item.price}.00</p>
          </div>
          <button onclick="removeFromCart(${index})" class="font-mono text-xs hover:opacity-60">remove</button>
        </div>
      `).join('');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function toggleCart() {
      document.getElementById('cart-drawer').classList.toggle('translate-x-full');
    }

    function checkout() {
      if (cart.length === 0) return showToast('Order slip is empty');
      cart = [];
      updateCartUI();
      toggleCart();
      showToast('Order confirmed — thank you');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    renderProducts(products);
  </script>
</body>
</html>
